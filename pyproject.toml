[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbtag-egt"
version = "1.0.0"
description = "Model identity as a spoofable greenbeard tag in an evolutionary AI race"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "evolutionary game theory",
    "greenbeard",
    "tag-based cooperation",
    "agent identity",
    "AI safety",
    "verification",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "egttools>=0.1.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
